# The scheme the browser used: an outer proxy's X-Forwarded-Proto when there is one
# (it terminates TLS), else this server's own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep redirects relative so the internal listen port never leaks
    # into Location headers seen through the upstream proxy.
    absolute_redirect off;
    port_in_redirect off;

    location / {
        # Serve real files directly; everything else (including
        # directories such as /games that shadow SPA routes) falls
        # back to the SPA entry point.
        try_files $uri /index.html;
    }

    # Strapi would redirect its root to /admin, outside /strapi
    location = /strapi/ {
        return 302 /strapi/admin/;
    }

    # Strapi in the same container: its API, uploads and admin panel, with the /strapi
    # prefix stripped (the admin is built for /strapi, see strapi/config/server.ts).
    location /strapi/ {
        proxy_pass http://127.0.0.1:1337/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        # What nginx saw, rather than appending, so a browser can't choose the IP Strapi
        # rate-limits admin logins by. shortcut: behind an outer proxy every login shares that
        # proxy's IP; add set_real_ip_from for it when an environment has one.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # The admin's login cookie is set for /admin; the browser sees it under /strapi/admin.
        proxy_cookie_path /admin /strapi/admin;
        # Strapi's own upload limit (200 MB), so nginx never refuses an admin upload first.
        client_max_body_size 200m;

        # "Refresh from IPS" answers only once every new Brand is created, which can take
        # minutes; past nginx's default 60 s the admin would show "failed" while it still
        # runs. Inherits the headers above; proxy_pass isn't inherited.
        location = /strapi/brand-refresh {
            proxy_pass http://127.0.0.1:1337/brand-refresh;
            proxy_read_timeout 10m;
        }
    }
}
